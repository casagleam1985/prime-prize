kind = "web"
previewPath = "/"
title = "Prize Competitions"
version = "1.0.0"
id = "artifacts/competitions"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18957

[services.development]
run = "pnpm --filter @workspace/competitions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/competitions", "run", "build" ]
publicDir = "artifacts/competitions/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18957"
BASE_PATH = "/"
